    <!-- Theme flash prevention — must run before first paint -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t) {
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          var r = document.documentElement;
          r.classList.remove("light", "dark");
          r.classList.add(t);
          r.style.colorScheme = t;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <!-- Structured data: FAQPage (Direct Answers for AEO / GEO / Google Rich Snippets) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I find cheaper products across online stores using GoCoupon?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Simply paste any product link or search term into GoCoupon's Live Price Comparison engine (/compare). GoCoupon instantly scans Amazon, Walmart, Target, Flipkart, and major retail stores, calculating shipping costs, stackable coupons, and payment discounts to identify which store offers the lowest checkout price."
            }
          },
          {
            "@type": "Question",
            "name": "How does GoCoupon's 90-day price tracker expose fake discounts?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "E-commerce sellers frequently raise prices before sales events and advertise misleading discounts. GoCoupon monitors daily price snapshots over 90 days, graphs the true historical trend line, marks the all-time lowest price, and alerts you whether today's deal is a genuine price drop or an artificial markup."
            }
          },
          {
            "@type": "Question",
            "name": "How does 1-click coupon auto-apply work at checkout?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "When you install the free GoCoupon Chrome extension and proceed to checkout on supported stores (Amazon, Walmart, Target, Flipkart, and 200+ partner stores), GoCoupon automatically tests all verified working discount codes in under 850 milliseconds and applies the single coupon that saves you the most money."
            }
          },
          {
            "@type": "Question",
            "name": "Where can I find today's verified deals and shopping discounts?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Visit GoCoupon's Deals Hub (/deals) to explore hand-tested lightning deals, verified promo codes, and all-time low price drops updated daily across electronics, smartphones, laptops, audio, and fashion."
            }
          },
          {
            "@type": "Question",
            "name": "Is GoCoupon free and safe to use?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, GoCoupon is 100% free with no subscription or account required. It is built on Google Manifest V3, operates locally in your browser, and never collects or sells your browsing history or personal data."
            }
          },
          {
            "@type": "Question",
            "name": "Can I stack payment discounts with store coupons on GoCoupon?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. GoCoupon identifies both merchant coupon codes and eligible card or payment method discounts, ensuring you combine store coupons with bank payment offers for maximum savings."
            }
          }
        ]
      }
    </script>
