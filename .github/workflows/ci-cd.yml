name: GoCoupon CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Continuous Integration: Typecheck, Build & Security Automated Tests
  # ============================================================================
  ci:
    name: Typecheck, Build & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 TypeScript Compilation Check
        run: npm run typecheck

      - name: 🏗️ Production Bundle & Static Routes Build
        run: npm run build

      - name: 🌐 Verify Static Pre-Rendered Routes & Artifacts
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/about.html || { echo "dist/about.html missing"; exit 1; }
          test -f dist/security.html || { echo "dist/security.html missing"; exit 1; }
          test -f dist/flipkart-coupons.html || { echo "dist/flipkart-coupons.html missing"; exit 1; }
          test -f dist/robots.txt || { echo "dist/robots.txt missing"; exit 1; }
          test -f dist/sitemap.xml || { echo "dist/sitemap.xml missing"; exit 1; }
          test -f dist/llms.txt || { echo "dist/llms.txt missing"; exit 1; }
          test -f dist/.well-known/security.txt || { echo "dist/.well-known/security.txt missing"; exit 1; }
          echo "✅ All critical pre-rendered routes and search engine artifacts verified."

      - name: 🚀 Start Test Server
        run: |
          ADMIN_PASSWORD="TestSecuredPass#2026!" npm run server &
          npx wait-on http://127.0.0.1:3000/api/health -t 30000
          curl -f http://127.0.0.1:3000/api/health

      - name: 🛡️ Execute Automated Security & Bug Bounty Test Suite
        run: npm run test:security
        env:
          TEST_BASE_URL: "http://127.0.0.1:3000"

  # ============================================================================
  # 2. Continuous Deployment: Zero-Downtime VPS Release (On Main Branch Push)
  # ============================================================================
  cd:
    name: Zero-Downtime VPS Deployment
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🚀 Deploy to VPS
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 Starting Automated GoCoupon Deployment..."
            TARGET_DIR="${{ secrets.VPS_APP_DIR || '/root/gocoupon-magic' }}"
            if [ -d "$TARGET_DIR" ]; then
              cd "$TARGET_DIR"
              chmod +x deploy.sh
              ./deploy.sh docker
            else
              echo "⚠️ Target directory $TARGET_DIR not found on VPS."
              exit 1
            fi

      - name: ℹ️ Deployment Status Notice
        if: env.VPS_HOST == ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "ℹ️ CI Pipeline passed with 100% green checks!"
          echo "   To enable automated VPS deployment on push:"
          echo "   Add VPS_HOST, VPS_SSH_KEY (and optional VPS_APP_DIR) to:"
          echo "   GitHub Repo Settings -> Secrets and variables -> Actions"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
