<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer circle -->
  <circle cx="50" cy="50" r="44" stroke="currentColor" stroke-width="7.7"/>
  <!-- Left hook: starts from bottom-left circle, arches over top, ends with round cap in center -->
  <path d="M 26.75 87.35 L 26.75 44.75 A 15.5 15.5 0 0 1 57.75 44.75 L 57.75 55.25"
        stroke="currentColor" stroke-width="7.7" stroke-linecap="round"/>
  <!-- Right hook: starts from top-right circle, arches under bottom, ends with round cap in center -->
  <path d="M 73.25 12.65 L 73.25 55.25 A 15.5 15.5 0 0 1 42.25 55.25 L 42.25 44.75"
        stroke="currentColor" stroke-width="7.7" stroke-linecap="round"/>
</svg>
