services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gocoupon-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - SEARXNG_URL=http://searxng:8080
      - REDIS_URL=redis://redis:6379
      - VITE_AMAZON_IN_PARTNER_TAG=gocoupon0e-21
      - VITE_CUELINKS_PUB_ID=148920
      - CUELINKS_API_KEY=${CUELINKS_API_KEY:-}
      - CUELINKS_PUBLISHER_ID=${CUELINKS_PUBLISHER_ID:-148920}
      - CUELINKS_CHANNEL_ID=${CUELINKS_CHANNEL_ID:-}
      - VITE_SKIMLINKS_PUB_ID=${VITE_SKIMLINKS_PUB_ID:-308997X1797324}
      - SKIMLINKS_SITE_ID=${SKIMLINKS_SITE_ID:-308997X1797324}
      # External API keys — loaded from .env on the VPS
      - SERPAPI_API_KEY=${SERPAPI_API_KEY:-}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
      # Supabase 90-Day Price Tracking Database
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-}
      # SMTP Email Configuration (Spacemail by Spaceship)
      - SMTP_HOST=${SMTP_HOST:-mail.spacemail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-support@gocoupon.io}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-"GoCoupon Support" <support@gocoupon.io>}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-support@gocoupon.io}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-GC_Admin_Secured#2026!}
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - searxng
    networks:
      - gocoupon-network

  redis:
    image: redis:7-alpine
    container_name: gocoupon-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - gocoupon-network

  searxng:
    image: searxng/searxng:latest
    container_name: gocoupon-searxng
    restart: always
    volumes:
      - ./services/searxng/searx:/etc/searxng:rw
      - ./services/searxng/searx/plugins:/usr/local/searxng/searx/plugins:rw
      - ./services/searxng/searx/engines:/usr/local/searxng/searx/engines:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4
    networks:
      - gocoupon-network

  caddy:
    image: caddy:2-alpine
    container_name: gocoupon-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Set your domain here — Caddyfile reads $DOMAIN
      - DOMAIN=${DOMAIN:-gocoupon.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - gocoupon-network

volumes:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  gocoupon-network:
    driver: bridge
